title = "MASK source secret scanning"
[extend]
useDefault = true

[allowlist]
description = "Ignored local secrets, dependency, build, and Git internals"
paths = [
  '''(^|/)\.env(?:\..*)?$''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.next/''',
  '''(^|/)\.git/''',
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mask-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "sqlalchemy==2.0.52",
  "alembic==1.19.1",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "pgvector==0.5.0",
  "argon2-cffi==25.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mask_api"]

name: native-quality
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: Run on the owner-provisioned isolated Windows integration runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12.13"
      - name: Install pinned tools and dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Static checks and offline tests
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:unit:ci
          pnpm schemas:check
          pnpm check:secrets
          pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Source secret scan
        run: pwsh -NoProfile -File scripts/scan-secrets.ps1
      - name: Synthetic test reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-unit-test-results
          path: reports/*.xml
          if-no-files-found: ignore
          retention-days: 7
  integration:
    # Never execute untrusted pull-request code with private runner access.
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: [self-hosted, windows, x64, mask-integration]
    environment: integration
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          python-version: "3.12.13"
      - run: uv sync --frozen
      - name: Verify explicitly provisioned local services
        env: &integration-env
          MASK_ENVIRONMENT: development
          MASK_ENABLE_DEV_ROUTES: "true"
          MASK_DATABASE_URL: ${{ secrets.MASK_DATABASE_URL }}
          MASK_MIGRATION_DATABASE_URL: ${{ secrets.MASK_MIGRATION_DATABASE_URL }}
          MASK_DEV_TOKEN: ${{ secrets.MASK_DEV_TOKEN }}
          MASK_TEST_API_URL: http://127.0.0.1:8000
        run: uv run python -m scripts.check_services
      - name: Real service integration
        env: *integration-env
        run: uv run pytest --integration tests/integration --junitxml=reports/python-integration.xml
      - name: Synthetic integration results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-integration-test-results
          path: reports/python-integration.xml
          if-no-files-found: ignore
          retention-days: 7
